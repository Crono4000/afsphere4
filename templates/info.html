<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>{{ title }}</title>
</head>
<body>

    <h1>{{ title }}</h1>

    <div>{{ content | safe }}</div>

    <div>
        {% for tag in tags %}
            <span class="badge rounded-pill text-bg-primary">{{ tag[0] }}</span>
        {% endfor %}
    </div>

    <a href="/edit_info/{{ info_id }}" class="btn btn-primary">Edit</a>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</body>
</html>
