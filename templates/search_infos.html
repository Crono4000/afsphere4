<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Search infos</title>
</head>
<body>

    <input id="search_bar"></input>
    <button class="btn btn-primary" id="search_button">Search</button>

    <table class="container">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
            </tr>
        </thead>

        <tbody>
            {% for info in infos %}
                <tr>
                    <td>{{ info[0] }}</td>
                    <td>{{ info[1] }}</td>
                    <td><button>page</button></td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

    <script>
        const button = document.getElementById("search_button");
        const bar = document.getElementById("search_bar");

        button.addEventListener("click", () => {
            window.location.href = "/search_infos?page=0&search=" + bar.value;
        });
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</body>
</html>
