<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Search infos</title>
    <link rel="stylesheet" href="/static/css/my.css">
</head>
<body>

    <input id="search_bar"></input>
    <button class="btn btn-primary" id="search_button">Search</button>

    <table class="container">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
            </tr>
        </thead>

        <tbody>
            {% for info in infos %}
                <tr>
                    <td>{{ info[0] }}</td>
                    <td><a href="/info/{{ info[0] }}">{{ info[1] }}</a></td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

    <div class="horizontal_div">
        <button class="btn" id="previous">previous</button>
        <p> Page {{ page }} </p>
        <button class="btn" id="next">next</button>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const search = params.get("search");
        const page = parseInt(window.location.pathname.split("/")[2], 10);

        const button = document.getElementById("search_button");
        const bar = document.getElementById("search_bar");
        bar.value = search;

        button.addEventListener("click", () => {
            window.location.href = "/search_infos/0?search=" + bar.value;
        });

        document.getElementById("previous").addEventListener("click", () => {
            if (page > 0)
                window.location.href = "/search_infos/" + (page - 1) + "?search=" + search;
            else
                window.location.reload();
        });

        document.getElementById("next").addEventListener("click", () => {
            window.location.href = "/search_infos/" + (page + 1) + "?search=" + search;
        });
    </script>

    <a class="btn btn-primary" href="/create_info">Add info</a>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</body>
</html>
