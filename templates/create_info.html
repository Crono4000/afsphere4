<!DOCTYPE html>
<html>
<head>
    <title>Create Info</title>
    <link rel="stylesheet" href="/static/css/my.css">
</head>
<body>

    <div class="h_center full_height">
    <h1>Create Info</h1>

    <form class="full_height" method="POST" action="/add_info">

        <label>Title:</label><br>
        <input type="text" name="title">

        <br>

        <label>Info:</label><br>
        <textarea class="full_width gg_height my_text" type="text" name="info"></textarea>

        <br>

        <label>Tags:</label><br>
        <textarea class="full_width my_text" type="text" name="tags"></textarea>

        <br>

        <button type="submit">Create</button>

    </form>
    </div>

</body>
</html>
