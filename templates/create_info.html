<!DOCTYPE html>
<html>
<head>
    <title>Create Info</title>
</head>
<body>

    <h1>Create Info</h1>

    <form method="POST" action="/post/add_info">

        <label>Title:</label>
        <input type="text" name="title">

        <br>

        <label>Info:</label>
        <textarea type="text" name="info"></textarea>

        <br>

        <label>Tags:</label>
        <textarea type="text" name="tags"></textarea>

        <br>

        <button type="submit">Create</button>

    </form>

</body>
</html>
