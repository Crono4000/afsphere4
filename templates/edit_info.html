<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Edit {{ title }}</title>
    <link rel="stylesheet" href="/static/css/my.css">
</head>
<body>

    <div class="h_center full_height">
    <form method="POST" action="/edit_title_info">
        <label>Edit Title</label><br>
        <input class="full_width" type="text" value="{{ title }}" name="title"></input>
        <input type="hidden" name="info_id" value="{{ info_id }}">
        <br>
        <button type="submit">Edit</button>
    </form>

    <form style="height: 80%;" method="POST" action="/edit_content_info">
        <label>Edit Content</label><br>
        <input type="hidden" name="info_id" value="{{ info_id }}">
        <textarea class="full_width gg_height my_text" type="text" name="content">{{ content | safe }}</textarea>
        <br>
        <button type="submit">Edit</button>
    </form>

    <div>
        {% for tag in tags %}
            <span class="badge rounded-pill text-bg-primary">{{ tag[0] }}</span>
        {% endfor %}
    </div>
    </div>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</body>
</html>
